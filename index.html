<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patagonia Fit &amp; Rehab · Pantalla de sesión</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D1D1B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --negro:#1D1D1B; --magenta:#AC07F2; --lima:#B2D705; --blanco:#FFFFFF;
    --bg:#131312; --panel:#1D1D1B; --card:#232321; --card-2:#2B2B28;
    --line:#3A3A36; --line-soft:#2E2E2B;
    --txt:#F2F2EF; --txt-2:#A9A9A2; --txt-3:#78786F;
    --ent:#AC07F2; --ent-txt:#D98CFB;      /* ENTRENAMIENTO */
    --kin:#B2D705; --kin-txt:#C9EC38;      /* KINESIOLOGÍA  */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);overflow:hidden;
       font-family:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #app{height:100vh;display:flex;flex-direction:column}
  button{font:inherit}

  /* ================= HEADER ================= */
  header{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:8px 18px;
         background:var(--panel);border-bottom:2px solid var(--magenta)}
  .logo{height:42px;width:auto;display:block;flex:0 0 auto}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:3px 0}
  .slot{display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
  .slot .hour{font-size:25px;font-weight:900;letter-spacing:-1px;color:var(--blanco);line-height:1}
  .slot .meta{font-size:11.5px;color:var(--txt-2);text-transform:capitalize;white-space:nowrap}

  .legend{display:flex;gap:8px;flex:0 0 auto}
  .lg{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.5px;
      text-transform:uppercase;color:var(--txt-2);white-space:nowrap}
  .lg i{width:10px;height:10px;border-radius:3px;display:block}
  .lg.ent i{background:var(--ent)} .lg.kin i{background:var(--kin)}
  .lg b{color:var(--blanco);font-size:12px}

  .spacer{flex:1}
  .horas{display:flex;gap:3px;background:#100F0F;border:1px solid var(--line);
         border-radius:8px;padding:3px;flex:0 0 auto}
  .horas button{font:inherit;font-size:11.5px;font-weight:800;color:var(--txt-2);
                background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;
                white-space:nowrap;font-variant-numeric:tabular-nums}
  .horas button:hover{color:var(--blanco);background:rgba(255,255,255,.05)}
  .horas button.on{background:var(--lima);color:#12120F}
  .horas button i{display:block;font-size:8.5px;font-weight:700;opacity:.7;font-style:normal}
  .conn{display:flex;align-items:center;gap:7px;flex:0 0 auto;font-size:10.5px;
        font-weight:700;color:var(--txt-3);background:var(--card);border:1px solid var(--line);
        padding:6px 11px;border-radius:7px;max-width:280px}
  .conn b{color:var(--txt-2)}
  .conn .dotf{width:7px;height:7px;border-radius:50%;background:var(--lima);flex:0 0 auto}
  .conn .dotf.off{background:#8A5A12}
  .conn .dotf.err{background:#C0182B}
  .btn{display:flex;align-items:center;gap:6px;flex:0 0 auto;white-space:nowrap;cursor:pointer;
       font-size:11.5px;font-weight:800;color:var(--txt-2);background:var(--card);
       border:1px solid var(--line);padding:8px 12px;border-radius:7px;transition:.15s}
  .btn:hover{color:var(--blanco);border-color:var(--lima)}
  .btn.primary{background:var(--magenta);color:#fff;border-color:var(--magenta)}
  .btn.primary:hover{filter:brightness(1.15);color:#fff}
  .btn kbd{font-size:9.5px;opacity:.6;border:1px solid currentColor;border-radius:3px;padding:0 3px;line-height:13px}
  .clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:900;letter-spacing:-.5px;flex:0 0 auto}
  body.zen header{display:none}

  /* ================= TABLERO (empaquetado tetris) ================= */
  main{flex:1;min-height:0;position:relative}
  .board{height:100%;overflow:hidden;display:grid;gap:8px;padding:9px 11px 11px;
         grid-template-columns:repeat(var(--cols,5),1fr);
         grid-auto-rows:6px;grid-auto-flow:row dense;align-content:start}
  .board.scroll{overflow:auto}
  .board::-webkit-scrollbar{width:8px}
  .board::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

  /* ================= TARJETA ================= */
  .card{--acc:var(--ent);--acc-txt:var(--ent-txt);
        background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);
        border-radius:10px;display:flex;flex-direction:column;overflow:hidden;position:relative;
        transition:box-shadow .15s,border-color .15s,opacity .2s}
  .card.kin{--acc:var(--kin);--acc-txt:var(--kin-txt)}
  .card:hover{box-shadow:0 8px 26px rgba(0,0,0,.55);border-color:var(--acc)}
  .card.saliendo{opacity:0;transform:scale(.94)}
  .card.done{opacity:.3;filter:grayscale(.8)}

  .c-head{padding:8px 11px 7px;border-bottom:1px solid var(--line-soft);flex:0 0 auto;
          background:var(--card-2);display:flex;align-items:flex-start;gap:8px}
  .c-id{flex:1;min-width:0}
  .c-name{font-size:16px;font-weight:900;letter-spacing:-.3px;line-height:1.12;color:var(--blanco);
          overflow-wrap:anywhere}
  .c-sub{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .tag{font-size:8.5px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;
       padding:2px 6px;border-radius:4px;white-space:nowrap;
       background:color-mix(in srgb,var(--acc) 18%,transparent);
       color:var(--acc-txt);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
  .tag.serv{background:var(--acc);color:#12120F;border-color:var(--acc)}

  .c-x{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);
       background:#191917;color:var(--txt-3);font-size:13px;font-weight:900;line-height:1;
       cursor:pointer;display:grid;place-items:center;transition:.14s}
  .c-x:hover{background:#C0182B;border-color:#C0182B;color:#fff}

  .c-body{flex:1;min-height:0;overflow:hidden;padding:8px 11px 10px;font-size:13px}
  .blocks{display:flex;flex-direction:column;gap:.68em}
  .blk-head{display:flex;align-items:flex-start;gap:.5em;margin-bottom:.36em}
  .blk-title{font-size:.7em;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
             color:var(--acc-txt);overflow-wrap:anywhere}
  .blk-line{flex:1;height:1px;background:var(--line-soft);margin-top:.55em}
  .rounds{font-size:.74em;font-weight:900;color:#12120F;background:var(--acc);
          padding:.1em .55em;border-radius:20px;white-space:nowrap}
  ul{list-style:none;display:flex;flex-direction:column;gap:.25em}
  li{display:flex;flex-wrap:wrap;align-items:baseline;gap:.12em .58em;font-size:1em;line-height:1.32}
  .reps{flex:0 0 auto;min-width:2.5em;text-align:right;font-weight:900;color:var(--acc-txt);
        font-variant-numeric:tabular-nums;font-size:.98em}
  .ex{flex:1 1 55%;min-width:0;color:var(--txt);overflow-wrap:anywhere}
  .load{flex:0 0 auto;margin-left:auto;font-size:.78em;font-weight:900;color:#12120F;
        background:var(--acc);padding:.08em .5em;border-radius:4px;white-space:nowrap}

  /* ================= SLOT VACÍO (+) ================= */
  .slot-add{border:2px dashed var(--line);border-radius:10px;background:transparent;
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
            color:var(--txt-3);cursor:pointer;transition:.15s;min-height:70px}
  .slot-add:hover{border-color:var(--lima);color:var(--lima);background:rgba(178,215,5,.05)}
  .slot-add .plus{font-size:30px;font-weight:300;line-height:1}
  .slot-add span{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}

  /* ================= BUSCADOR ================= */
  .ov{position:fixed;inset:0;z-index:70;display:none;background:rgba(8,8,7,.9);padding:40px;place-items:start center}
  .ov.on{display:grid}
  .sheet{width:min(820px,94vw);max-height:86vh;display:flex;flex-direction:column;
         background:var(--card);border:1px solid var(--line);border-top:4px solid var(--lima);
         border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.8);overflow:hidden;
         animation:pop .18s cubic-bezier(.2,.9,.3,1)}
  @keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
  .sheet h2{font-size:19px;font-weight:900;letter-spacing:-.3px}
  .sh-head{padding:18px 22px 14px;border-bottom:1px solid var(--line-soft);background:var(--card-2)}
  .sh-sub{font-size:12px;color:var(--txt-2);margin-top:3px}
  .sh-tools{display:flex;gap:9px;padding:13px 22px;border-bottom:1px solid var(--line-soft);align-items:center}
  #q{flex:1;background:#181816;border:1px solid var(--line);color:var(--txt);
     padding:11px 14px;border-radius:9px;font:inherit;font-size:15px;outline:none}
  #q:focus{border-color:var(--lima)}
  .filtros{display:flex;gap:4px;background:#151513;border:1px solid var(--line);border-radius:8px;padding:3px}
  .filtros button{font-size:11px;font-weight:800;color:var(--txt-2);background:none;border:0;
                  padding:7px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .filtros button.on{background:var(--lima);color:#12120F}
  .sh-list{overflow:auto;padding:10px 14px 16px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;cursor:pointer;
       border:1px solid transparent}
  .row:hover{background:#1B1B19;border-color:var(--line)}
  .row .pill{width:5px;align-self:stretch;border-radius:4px;flex:0 0 auto}
  .row.ent .pill{background:var(--ent)} .row.kin .pill{background:var(--kin)}
  .row .nm{font-size:16px;font-weight:800;flex:1;min-width:0}
  .row .mt{font-size:11.5px;color:var(--txt-2);white-space:nowrap}
  .row .hr{font-size:13px;font-weight:900;color:var(--txt);min-width:52px;font-variant-numeric:tabular-nums}
  .row .go{font-size:11px;font-weight:900;color:#12120F;background:var(--lima);padding:5px 11px;border-radius:6px}
  .vacio{padding:26px;text-align:center;color:var(--txt-3);font-size:14px}
  .fuente{padding:11px 22px;border-top:1px solid var(--line-soft);background:var(--card-2);
          font-size:11px;color:var(--txt-3);display:flex;align-items:center;gap:8px}
  .fuente b{color:var(--txt-2)}
  .dotf{width:7px;height:7px;border-radius:50%;background:var(--lima);flex:0 0 auto}
  .dotf.off{background:#8A5A12}


  .row .ses{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
  .row .go{font-size:11.5px;font-weight:900;color:#12120F;background:var(--lima);
           border:0;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .row .go:hover{filter:brightness(1.12)}
  .row.ent .go{background:var(--ent);color:#fff}
  .row .go.hecha{background:#33332F;color:var(--txt-3)}
  .row .go.hecha::after{content:" ✓"}
  .zswitch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
           padding:12px 32px;border-bottom:1px solid var(--line-soft);background:#1E1E1C}
  .zswitch span{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--txt-3)}
  .zswitch button{font-size:14px;font-weight:800;color:var(--txt);background:var(--card-2);
                  border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer}
  .zswitch button:hover{border-color:var(--acc);color:var(--acc-txt)}

  /* ================= ZOOM ================= */
  #zoom{position:fixed;inset:0;z-index:60;display:none;background:rgba(8,8,7,.95);padding:30px;place-items:center}
  #zoom.on{display:grid}
  .zcard{width:min(1300px,95vw);max-height:93vh;overflow:auto;background:var(--card);
         border:1px solid var(--line);border-top:5px solid var(--acc,var(--magenta));border-radius:18px;
         box-shadow:0 30px 90px rgba(0,0,0,.85);animation:pop .2s cubic-bezier(.2,.9,.3,1)}
  .zcard .c-head{padding:24px 32px 20px}
  .zcard .c-name{font-size:42px}
  .zcard .tag{font-size:12.5px;padding:4px 10px}
  .zcard .c-x{display:none}
  .zcard .c-body{padding:22px 32px 30px;font-size:23px;overflow:visible}
  .zcard .blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1em;align-items:start}
  .zclose{position:fixed;top:24px;right:28px;z-index:71;width:44px;height:44px;border-radius:50%;
          background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:19px;cursor:pointer;display:none}
  .zclose:hover{border-color:var(--lima);color:var(--lima)}

  /* ================= TOAST ================= */
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);z-index:80;
         display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
         border-left:4px solid var(--lima);padding:12px 16px;border-radius:10px;
         box-shadow:0 12px 40px rgba(0,0,0,.6);opacity:0;transition:.22s;pointer-events:none;font-size:13.5px}
  #toast.on{transform:translateX(-50%);opacity:1;pointer-events:auto}
  #toast b{color:var(--blanco)}
  #toast button{background:var(--lima);color:#12120F;border:0;padding:7px 13px;border-radius:6px;
                font-size:12px;font-weight:900;cursor:pointer}

  .hint{position:absolute;bottom:10px;left:15px;font-size:10.5px;color:var(--txt-3);pointer-events:none}
  .hint b{color:var(--txt-2)}
  #zenout{position:fixed;top:9px;right:13px;z-index:50;display:none;font-size:10.5px;font-weight:800;
          color:var(--txt-3);background:rgba(29,29,27,.92);border:1px solid var(--line);
          padding:6px 10px;border-radius:7px;cursor:pointer}
  body.zen #zenout{display:block}
</style>
</head>

  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); };

function estado(txt, clase){
  $('#connTxt').innerHTML = txt;

}

/* ---------- normalizadores ---------- */
const esKine = v => String(v || '').toLowerCase().startsWith('kin');
function normHora(v){
  const t = String(v || '').trim();
  const m = t.match(/^(\d{1,2}):(\d{2})\s*(a\.?\s*m\.?|p\.?\s*m\.?)?/i);
  if (!m) return t;
  let h = +m[1];
  const suf = (m[3] || '').replace(/[.\s]/g,'').toLowerCase();
  if (suf === 'pm' && h < 12) h += 12;
  if (suf === 'am' && h === 12) h = 0;
  return String(h).padStart(2,'0') + ':' + m[2];
}
function limpiaBloques(bs){
  return (bs || []).map(b => ({
    titulo: b.titulo || '', rondas: b.rondas || '',
    ejercicios: (b.ejercicios || []).filter(e => e && e.nombre)
      .map(e => ({reps: e.reps || '', nombre: e.nombre, carga: e.carga || ''}))
  })).filter(b => b.ejercicios.length);
}

/* ---------- A) catálogo de clientes ---------- */
function desdeCatalogo(json){
  return (json.clientes || []).map((c, i) => ({
    id: String(c.id ?? c.rut ?? ('c'+i)),
    nombre: c.nombre || 'Sin nombre',
    rut: c.rut || '',
    tipo: esKine(c.servicio) ? 'kinesiologia' : 'entrenamiento',
    profesional: c.profesional || '',
    objetivo: (c.plan && c.plan.objetivo) || '',
    plan: (c.plan && c.plan.nombre) || '',
    hora: '',
    sesiones: (c.sesiones || []).map((s, j) => ({
      id: String(s.id ?? (i+'-'+j)),
      etiqueta: s.etiqueta || s.sesion || ('Sesión ' + (j+1)),
      titulo: s.titulo || '',
      hecha: !!s.hecha,
      bloques: limpiaBloques(s.bloques)
    })).filter(s => s.bloques.length)
  })).filter(c => c.sesiones.length);
}

/* ---------- B) sesiones agendadas del día ---------- */
function desdeAgenda(json){
  const porCliente = new Map();
  (json.sesiones || []).forEach((s, i) => {
    if (String(s.estado || '').toLowerCase() === 'cancelada') return;
    const bl = limpiaBloques(s.bloques);
    if (!bl.length) return;
    const cl = s.cliente || {};
    const id = String(s.reserva_id ?? cl.rut ?? ('s'+i));
    const p = s.plan || {};
    porCliente.set(id, {
      id, nombre: cl.nombre || 'Sin nombre', rut: cl.rut || '',
      tipo: esKine(cl.servicio) ? 'kinesiologia' : 'entrenamiento',
      profesional: s.profesional || '',
      objetivo: p.objetivo || '', plan: p.nombre || '',
      hora: normHora(s.hora_inicio),
      sesiones: [{
        id: String(p.sesion_id ?? id),
        etiqueta: p.sesion || '', titulo: p.sesion_titulo || '',
        hecha: false, bloques: bl, propuesta: true
      }].concat((p.sesiones_disponibles || [])
        .filter(x => String(x.id) !== String(p.sesion_id))
        .map(x => ({id: String(x.id), etiqueta: x.etiqueta || '', titulo: x.titulo || '',
                    hecha: !!x.hecha, bloques: []})))
    });
  });
  return [...porCliente.values()];
}

/* ---------- C) CSV ---------- */
function parseCSV(txt){
  const filas = []; let f = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ','){ f.push(cur); cur = ''; }
    else if (ch === '\n'){ f.push(cur); filas.push(f); f = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur || f.length){ f.push(cur); filas.push(f); }
  return filas.filter(r => r.some(v => v.trim() !== ''));
}
function desdeCSV(txt, fecha){
  const filas = parseCSV(txt);
  if (!filas.length) return [];
  const head = filas[0].map(h => h.trim().toLowerCase());
  const ix = n => head.indexOf(n);
  const C = {fecha:ix('fecha'),hora:ix('hora'),cliente:ix('cliente'),tipo:ix('tipo'),dia:ix('dia'),
             objetivo:ix('objetivo'),bloque:ix('bloque'),rondas:ix('rondas'),reps:ix('reps'),
             ejercicio:ix('ejercicio'),carga:ix('carga')};
  const mapa = new Map();
  for (let i = 1; i < filas.length; i++){
    const r = filas[i], g = k => C[k] >= 0 ? (r[C[k]] || '').trim() : '';
    const nombre = g('cliente'); if (!nombre) continue;
    if (fecha && g('fecha') && g('fecha') !== fecha) continue;
    const key = nombre.toLowerCase();
    if (!mapa.has(key)) mapa.set(key, {
      id: 'g'+mapa.size, nombre, rut: '', tipo: esKine(g('tipo')) ? 'kinesiologia' : 'entrenamiento',
      profesional: '', objetivo: g('objetivo'), plan: '', hora: normHora(g('hora')),
      sesiones: [{id: 'g'+mapa.size+'-s', etiqueta: g('dia') || 'Sesión', titulo: '', hecha: false, bloques: []}]
    });
    const c = mapa.get(key), ses = c.sesiones[0];
    const bt = g('bloque') || 'Sesión';
    let b = ses.bloques.find(x => x.titulo === bt);
    if (!b){ b = {titulo: bt, rondas: g('rondas'), ejercicios: []}; ses.bloques.push(b); }
    if (!b.rondas && g('rondas')) b.rondas = g('rondas');
    if (g('ejercicio')) b.ejercicios.push({reps: g('reps'), nombre: g('ejercicio'), carga: g('carga')});
  }
  return [...mapa.values()].filter(c => c.sesiones[0].bloques.length);
}

/* ---------- candidatos ---------- */
function armarCandidatos(){
  CAND = [];
  CATALOGO.forEach(c => c.sesiones.forEach(s => {
    if (s.bloques.length) CAND.push({key: c.id + '|' + s.id, cliente: c, sesion: s});
  }));
}

/* ---------- caché ---------- */
function cacheGuardar(){ try{
  localStorage.setItem('pf_cache', JSON.stringify({f: CONFIG.fecha || hoy(), m: MODO, d: CATALOGO}));
}catch(e){} }
function cacheLeer(){ try{
  const c = JSON.parse(localStorage.getItem('pf_cache') || 'null');
  if (c && c.f === (CONFIG.fecha || hoy())) { MODO = c.m || 'catalogo'; return c.d; }
}catch(e){} return null; }

/* ---------- sincronizar ---------- */
async function sincronizar(silencioso){
  const fecha = CONFIG.fecha || hoy();
  const url = CONFIG.endpointAgenda || CONFIG.endpoint || CONFIG.csv;

  if (!url){
    MODO = 'catalogo';
    CATALOGO = desdeCatalogo(DEMO);
    armarCandidatos();
    estado('Datos de <b>demostración</b> — configura <b>CONFIG.endpoint</b>', 'off');
    primeraCarga(); return;
  }

  if (!silencioso) estado('Consultando…', 'off');
  try {
    const sep = url.includes('?') ? '&' : '?';
    const r = await fetch(url + sep + 'fecha=' + encodeURIComponent(fecha) + '&_=' + Date.now(),
                          {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);

    if (CONFIG.csv && !CONFIG.endpoint && !CONFIG.endpointAgenda){
      MODO = 'agenda'; CATALOGO = desdeCSV(await r.text(), fecha);
    } else {
      const j = await r.json();
      // el formato de la respuesta decide el modo
      if (Array.isArray(j.clientes)) { MODO = 'catalogo'; CATALOGO = desdeCatalogo(j); }
      else                           { MODO = 'agenda';   CATALOGO = desdeAgenda(j); }
    }

    armarCandidatos();
    cacheGuardar();
    fichas = fichas.filter(k => cand(k));
    const hh = new Date().toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'});
    estado(`<b>CMS</b> · ${CATALOGO.length} ${MODO === 'catalogo' ? 'clientes' : 'sesiones'} · ${hh}`, '');
    primeraCarga();
  } catch (e) {
    const c = cacheLeer();
    if (c && !CATALOGO.length){
      CATALOGO = c; armarCandidatos();
      estado('Sin conexión — mostrando <b>última copia</b>', 'err');
      primeraCarga();
    } else {
      estado('Error al leer: <b>' + esc(e.message) + '</b>', 'err');
      render();
    }
  }
}

function primeraCarga(){
  if (!yaCargo){
    yaCargo = true;
    if (MODO === 'agenda'){
      const h = horaAhora();
      horaSel = (CONFIG.cargarHoraActual && CATALOGO.some(c => c.hora === h)) ? h : 'todas';
      fichas = deLaHora().slice(0, CAP).map(c => c.id + '|' + c.sesiones[0].id);
    } else {
      fichas = [];                       // en catálogo la pantalla arranca vacía
    }
  } else if (MODO === 'agenda' && CONFIG.cargarHoraActual){
    deLaHora().forEach(c => {
      const k = c.id + '|' + c.sesiones[0].id;
      if (fichas.length < CAP && !fichas.includes(k) && !quitados.has(k)) fichas.push(k);
    });
  }
  pintarCabecera(); pintarHoras(); render(); listar();
}
function deLaHora(){
  return CATALOGO.filter(c => horaSel === 'todas' || c.hora === horaSel);
}

/* ---------- cabecera ---------- */
function pintarCabecera(){
  $('#slotHour').textContent = (MODO === 'agenda' && horaSel !== 'todas') ? horaSel : 'HOY';
  $('#slotDate').textContent = new Date((CONFIG.fecha || hoy()) + 'T12:00:00')
    .toLocaleDateString('es-CL', {weekday:'long', day:'numeric', month:'long'});
}
function pintarHoras(){
  const horas = MODO === 'agenda'
    ? [...new Set(CATALOGO.map(c => c.hora).filter(Boolean))].sort() : [];
  if (!horas.length){ $('#horas').innerHTML = ''; $('#horas').style.display = 'none'; return; }
  $('#horas').style.display = '';
  $('#horas').innerHTML =
    `<button data-h="todas" class="${horaSel==='todas'?'on':''}">Todas<i>${CATALOGO.length}</i></button>` +
    horas.map(h => `<button data-h="${h}" class="${horaSel===h?'on':''}">${h}<i>${
      CATALOGO.filter(c=>c.hora===h).length}</i></button>`).join('');
}
function cambiarHora(h){
  horaSel = h; quitados.clear();
  fichas = deLaHora().slice(0, CAP).map(c => c.id + '|' + c.sesiones[0].id);
  pintarCabecera(); pintarHoras(); render(); listar();
}

/* ---------- markup ---------- */
function blocksHTML(ses){
  return '<div class="blocks">' + ses.bloques.map(b => `
    <div class="blk">
      <div class="blk-head">
        <span class="blk-title">${esc(b.titulo)}</span><span class="blk-line"></span>
        ${b.rondas?`<span class="rounds">${esc(b.rondas)}</span>`:''}
      </div>
      <ul>${b.ejercicios.map(e => `<li><span class="reps">${esc(e.reps||'·')}</span><span class="ex">${esc(e.nombre)}</span>${e.carga?`<span class="load">${esc(e.carga)}</span>`:''}</li>`).join('')}</ul>
    </div>`).join('') + '</div>';
}
function headHTML(c, ses, key){
  return `<div class="c-head">
    <div class="c-id">
      <div class="c-name">${esc(c.nombre)}</div>
      <div class="c-sub">
        <span class="tag serv">${c.tipo==='kinesiologia'?'Kinesio':'Entren.'}</span>
        ${ses.etiqueta?`<span class="tag">${esc(ses.etiqueta)}</span>`:''}
        ${ses.titulo?`<span class="tag">${esc(ses.titulo)}</span>`:(c.objetivo?`<span class="tag">${esc(c.objetivo)}</span>`:'')}
        ${c.hora?`<span class="tag">${esc(c.hora)}</span>`:''}
      </div>
    </div>
    ${key?`<button class="c-x" data-x="${esc(key)}" title="Sacar de la pantalla">✕</button>`:''}
  </div>`;
}
function cardHTML(k){
  const c = cand(k); if (!c) return '';
  return `<article class="card${c.cliente.tipo==='kinesiologia'?' kin':''}" data-k="${esc(k)}">
    ${headHTML(c.cliente, c.sesion, k)}<div class="c-body">${blocksHTML(c.sesion)}</div></article>`;
}

/* ---------- columnas ---------- */
function bestCols(n){
  if (n <= 0) return 4;
  let best = 4, bs = -1;
  for (let k = 2; k <= 6; k++){
    const rows = Math.ceil(n/k), w = innerWidth/k,
          h = (innerHeight - (document.body.classList.contains('zen') ? 20 : 64)) / rows;
    const s = Math.min(w/300, h/210) - Math.abs(k*rows - n) * 0.03;
    if (s > bs){ bs = s; best = k; }
  }
  return best;
}

/* ---------- empaquetado tetris ---------- */
const ROW = 6, GAP = 8, FMIN = 7, FMAX = 19;
function altoNatural(card){
  const head = card.querySelector('.c-head'), body = card.querySelector('.c-body');
  const cs = getComputedStyle(body);
  return head.offsetHeight + body.querySelector('.blocks').offsetHeight
       + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + 4;
}
function fits(el){ return el.scrollHeight <= el.clientHeight + 1; }
function aplicar(fs){
  const board = $('#board');
  board.querySelectorAll('.card').forEach(c => c.querySelector('.c-body').style.fontSize = fs.toFixed(2)+'px');
  board.offsetHeight;
  board.querySelectorAll('.card').forEach(c => {
    c.style.gridRow = 'span ' + Math.max(6, Math.ceil((altoNatural(c)+GAP)/(ROW+GAP)));
  });
  const add = board.querySelector('.slot-add');
  if (add) add.style.gridRow = 'span ' + Math.ceil((78+GAP)/(ROW+GAP));
  return board.scrollHeight <= board.clientHeight + 1;
}
function mejorTamano(){                       // mayor letra que entra, o null
  if (aplicar(FMAX)) return FMAX;
  let lo = FMIN, hi = FMAX, ok = null;
  for (let i = 0; i < 12; i++){
    const mid = (lo+hi)/2;
    if (aplicar(mid)){ ok = mid; lo = mid; } else hi = mid;
  }
  return ok;
}
function empaquetar(){
  const board = $('#board');
  board.classList.remove('scroll');
  const n = board.querySelectorAll('.card').length;
  if (!n) return;

  // prueba varios repartos de columnas y se queda con el que da la letra más grande
  let mejorCols = null, mejorFs = -1;
  for (let cols = Math.max(2, Math.min(3, n)); cols <= Math.min(7, Math.max(3, n)); cols++){
    board.style.setProperty('--cols', cols);
    const fs = mejorTamano();
    if (fs !== null && fs > mejorFs + 0.15){ mejorFs = fs; mejorCols = cols; }
  }
  if (mejorCols === null){                    // no entra ni al mínimo: se deja scroll
    board.style.setProperty('--cols', bestCols(n));
    aplicar(FMIN); board.classList.add('scroll');
    crecerCadaUna(FMIN); return;
  }
  board.style.setProperty('--cols', mejorCols);
  aplicar(mejorFs);
  crecerCadaUna(mejorFs);
}

/* Una vez fijado el alto de cada ficha, la más cargada ya no le impone su
   tamaño de letra a las demás: cada una crece hasta llenar SU propio espacio. */
function crecerCadaUna(base){
  $('#board').querySelectorAll('.card').forEach(card => {
    const body = card.querySelector('.c-body');
    if (!fits(body)) return;
    let lo = base, hi = FMAX, mejor = base;
    for (let i = 0; i < 10; i++){
      const mid = (lo + hi) / 2;
      body.style.fontSize = mid.toFixed(2) + 'px';
      if (fits(body)){ mejor = mid; lo = mid; } else hi = mid;
    }
    body.style.fontSize = mejor.toFixed(2) + 'px';
  });
}

/* ---------- render ---------- */
function render(){
  const board = $('#board');
  const vis = fichas.filter(k => cand(k));
  board.innerHTML = vis.map(cardHTML).join('') +
    (vis.length < CAP
      ? `<button class="slot-add" id="slotAdd"><span class="plus">＋</span><span>${
          vis.length ? 'Agregar sesión' : 'Buscar la primera sesión'}</span></button>`
      : '');
  const cs = vis.map(k => cand(k).cliente);
  $('#nEnt').textContent = cs.filter(c => c.tipo !== 'kinesiologia').length;
  $('#nKin').textContent = cs.filter(c => c.tipo === 'kinesiologia').length;
  requestAnimationFrame(empaquetar);
}

/* ---------- quitar / agregar ---------- */
function quitar(k){
  const i = fichas.indexOf(k); if (i < 0) return;
  const c = cand(k);
  const el = document.querySelector(`.card[data-k="${CSS.escape(k)}"]`);
  ultimoBorrado = {k, pos: i}; quitados.add(k);
  if (el) el.classList.add('saliendo');
  setTimeout(() => { fichas.splice(i,1); render(); listar(); }, 160);
  toast(`<b>${esc(c ? c.cliente.nombre : '')}</b> salió de la pantalla`);
}
function agregar(k){
  if (fichas.includes(k)) return;
  const c = cand(k); if (!c) return;
  // ¿esta persona ya está proyectada? entonces esto es un CAMBIO de sesión,
  // que conserva su lugar y no cuenta contra la capacidad
  const prev = fichas.findIndex(x => cand(x) && cand(x).cliente.id === c.cliente.id);
  if (prev < 0 && fichas.length >= CAP){ toast(`Pantalla llena (${CAP})`, true); return; }
  quitados.delete(k);
  if (prev >= 0) fichas[prev] = k;
  else           fichas.push(k);
  render(); listar();
}
function cambiarSesion(k){                 // cambia la sesión de una ficha ya proyectada
  const c = cand(k); if (!c) return;
  agregar(k); zclose();
}
function toast(html, sinUndo){
  $('#toastTxt').innerHTML = html;
  $('#toastBtn').style.display = sinUndo ? 'none' : '';
  $('#toast').classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('on'), 6000);
}
$('#toastBtn').onclick = () => {
  if (!ultimoBorrado) return;
  fichas.splice(Math.min(ultimoBorrado.pos, fichas.length), 0, ultimoBorrado.k);
  quitados.delete(ultimoBorrado.k);
  ultimoBorrado = null; $('#toast').classList.remove('on'); render(); listar();
};

/* ---------- buscador ---------- */
function listar(){
  const q = $('#q').value.trim().toLowerCase();
  const puestos = new Set(fichas.map(k => cand(k) && cand(k).cliente.id));
  const libres = CATALOGO
    .filter(c => !puestos.has(c.id))
    .filter(c => filtro === 'todos' || c.tipo === filtro)
    .filter(c => horaSel === 'todas' || !c.hora || c.hora === horaSel)
    .filter(c => !q || c.nombre.toLowerCase().includes(q)
              || (c.objetivo||'').toLowerCase().includes(q)
              || (c.rut||'').includes(q))
    .sort((a,b) => (a.hora||'').localeCompare(b.hora||'') || a.nombre.localeCompare(b.nombre));

  $('#shList').innerHTML = libres.length ? libres.map(c => {
    const ses = c.sesiones.filter(s => s.bloques.length);
    return `<div class="row ${c.tipo==='kinesiologia'?'kin':'ent'}">
      <span class="pill"></span>
      ${c.hora?`<span class="hr">${esc(c.hora)}</span>`:''}
      <span class="nm">${esc(c.nombre)}</span>
      <span class="mt">${c.tipo==='kinesiologia'?'Kinesiología':'Entrenamiento'}${
        c.plan?' · '+esc(c.plan):''}${c.profesional?' · '+esc(c.profesional):''}</span>
      <span class="ses">${ses.map(s =>
        `<button class="go${s.hecha?' hecha':''}" data-add="${esc(c.id+'|'+s.id)}"
           title="${esc(s.titulo||'')}${s.hecha?' · ya realizada':''}">${esc(s.etiqueta||'Proyectar')}</button>`
      ).join('')}</span>
    </div>`;
  }).join('') : `<div class="vacio">No hay clientes que coincidan.</div>`;
}
function abrirBuscador(){
  $('#shSub').textContent =
    `${fichas.length} de ${CAP} fichas en pantalla · ${CATALOGO.length} ${MODO==='catalogo'?'clientes con plan':'sesiones del día'}`
    + (MODO==='agenda' && horaSel!=='todas' ? ` · bloque de las ${horaSel}` : '');
  $('#fuenteTxt').innerHTML = $('#connTxt').innerHTML;
  $('#dotf').className = $('#conn .dotf').className;
  $('#buscador').classList.add('on'); $('#q').value = ''; listar();
  setTimeout(() => $('#q').focus(), 40);
}
function cerrarBuscador(){ $('#buscador').classList.remove('on'); }

/* ---------- zoom, con cambio de sesión ---------- */
function zopen(k){
  const c = cand(k); if (!c) return; zkey = k;
  const z = $('#zcard');
  const kin = c.cliente.tipo === 'kinesiologia';
  z.style.setProperty('--acc', kin ? 'var(--kin)' : 'var(--ent)');
  z.style.setProperty('--acc-txt', kin ? 'var(--kin-txt)' : 'var(--ent-txt)');
  const otras = c.cliente.sesiones.filter(s => s.bloques.length && s.id !== c.sesion.id);
  z.innerHTML = headHTML(c.cliente, c.sesion, null)
    + (otras.length ? `<div class="zswitch"><span>Cambiar sesión:</span>${
        otras.map(s => `<button data-sw="${esc(c.cliente.id+'|'+s.id)}">${esc(s.etiqueta)}${
          s.titulo?` · ${esc(s.titulo)}`:''}</button>`).join('')}</div>` : '')
    + `<div class="c-body">${blocksHTML(c.sesion)}</div>`;
  $('#zoom').classList.add('on'); $('#zclose').style.display = 'block';
}
function zclose(){ $('#zoom').classList.remove('on'); $('#zclose').style.display = 'none'; zkey = null; }

/* ---------- eventos ---------- */
$('#board').addEventListener('click', e => {
  const x = e.target.closest('[data-x]');
  if (x){ e.stopPropagation(); quitar(x.dataset.x); return; }
  if (e.target.closest('#slotAdd')) return abrirBuscador();
  const card = e.target.closest('.card'); if (card) zopen(card.dataset.k);
});
$('#shList').addEventListener('click', e => {
  const r = e.target.closest('[data-add]');
  if (r){ agregar(r.dataset.add); if (fichas.length >= CAP) cerrarBuscador(); }
});
$('#zcard').addEventListener('click', e => {
  const b = e.target.closest('[data-sw]'); if (b) cambiarSesion(b.dataset.sw);
});
$('#q').addEventListener('input', listar);
$('#filtros').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filtro = b.dataset.f;
  [...$('#filtros').children].forEach(x => x.classList.toggle('on', x === b));
  listar();
});
$('#horas').addEventListener('click', e => { const b = e.target.closest('button'); if (b) cambiarHora(b.dataset.h); });
$('#btnAdd').onclick = abrirBuscador;
$('#btnSync').onclick = () => sincronizar();
$('#buscador').addEventListener('click', e => { if (e.target.id === 'buscador') cerrarBuscador(); });
$('#zoom').addEventListener('click', e => { if (e.target.id === 'zoom') zclose(); });
$('#zclose').onclick = zclose;
$('#btnAll').onclick = () => { fichas = []; quitados.clear(); render(); listar(); };
function zen(){ document.body.classList.toggle('zen'); requestAnimationFrame(render); }
$('#btnZen').onclick = zen; $('#zenout').onclick = zen;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ zclose(); cerrarBuscador(); return; }
  if (document.activeElement === $('#q')) return;
  if (e.key === 'a' || e.key === 'A' || e.key === '+'){ e.preventDefault(); abrirBuscador(); }
  if (e.key === 'z' || e.key === 'Z') zen();
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });

/* ---------- reloj ---------- */
function reloj(){ const n = new Date();
  $('#clock').textContent = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
setInterval(reloj, 1000); reloj();
pintarCabecera();

render();
sincronizar(false);

/* ---------- app instalable ---------- */
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
let instalador = null;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); instalador = e;
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = '⬇ Instalar app';
  b.onclick = async () => { instalador.prompt(); await instalador.userChoice; b.remove(); };
  document.querySelector('#btnZen').before(b);
});
if (CONFIG.refrescoSegundos > 0 && (CONFIG.endpoint || CONFIG.endpointAgenda || CONFIG.csv))
  refT = setInterval(() => sincronizar(true), CONFIG.refrescoSegundos * 1000);
</script>
